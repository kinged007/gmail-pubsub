name: ci
on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install ruff mypy pytest pytest-asyncio httpx faker pytest-cov
      - name: Ruff check
        run: ruff check tests src/app src/utils app/utils.py --output-format concise || true
      - name: Ruff format check
        run: ruff format --check tests src/app src/utils app/utils.py || true
      - name: Mypy
        run: mypy src app --ignore-missing-imports --exclude tests || true
      - name: Pytest
        run: pytest -q
